spring.application.name=gestao-custos-obras
# ==========================
# Configuracoes do servidor
# ==========================
server.port=8080

# ==========================
# Banco de dados - PostgreSQL
# ==========================
spring.datasource.url=jdbc:postgresql://localhost:5432/gestao_custos_obras
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================
# JPA / Hibernate
# ==========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================
# Flyway Migrations
# ==========================
# PAUSADO (ADR-013) enquanto a modelagem do MVP não fecha — schema por
# ddl-auto=update acima. FlywayConfig está sem @Configuration; reativar
# junto (ddl-auto=validate + religar @Configuration).
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration

# ==========================
# JWT
# ==========================
app.jwt.secret=changeme-256-bits-min-32-chars-secret-key-dev-only
app.jwt.expiration-minutos=120

# ==========================
# Upload de Arquivos
# ==========================
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB