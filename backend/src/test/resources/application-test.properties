# Perfil `test`: só o banco muda em relação a application.properties (usuário
# e senha são os mesmos do dev, herdados). Banco criado uma vez por
# db/manual/criar-banco-teste.sql; schema recriado a cada execução
# (ddl-auto=create-drop). Postgres desligado ou banco inexistente => teste
# falha (nunca pula) — é a proteção que os testes de integração existem para dar.
#
# ponytail: banco local fixo em vez de Testcontainers porque o projeto ainda
# não usa Docker; trocar quando isso mudar (ADR-045, item em PROXIMOS-PASSOS.md).
spring.datasource.url=jdbc:postgresql://localhost:5432/gestao_custos_obras_test

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
