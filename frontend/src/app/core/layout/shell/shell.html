<mat-toolbar color="primary">Gestão de Custos de Obras</mat-toolbar>

<mat-sidenav-container class="container">
  <mat-sidenav mode="side" opened>
    <mat-nav-list>
      @for (link of links; track link.path) {
        <a mat-list-item [routerLink]="link.path" routerLinkActive="active">{{ link.label }}</a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="content">
    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>
