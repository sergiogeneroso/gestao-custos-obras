<div class="detalhe-despesa">
  <div class="detalhe-despesa__topo">
    <h2 mat-dialog-title>Despesa</h2>
    <div class="detalhe-despesa__navegacao">
      <button
        mat-icon-button
        type="button"
        [disabled]="indice() === 0"
        (click)="anterior()"
        aria-label="Despesa anterior"
      >
        <i class="ph ph-caret-left"></i>
      </button>
      <span>{{ indice() + 1 }} de {{ despesas().length }}</span>
      <button
        mat-icon-button
        type="button"
        [disabled]="indice() === despesas().length - 1"
        (click)="proxima()"
        aria-label="Próxima despesa"
      >
        <i class="ph ph-caret-right"></i>
      </button>
      <button mat-icon-button type="button" (click)="fechar()" aria-label="Fechar">
        <i class="ph ph-x"></i>
      </button>
    </div>
  </div>

  <mat-dialog-content>
    <app-despesa-painel-detalhe [despesa]="despesa()" [mostrarImovel]="true" />
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-stroked-button type="button" color="primary" (click)="editar()">
      <i class="ph ph-pencil-simple"></i>
      Editar
    </button>
  </mat-dialog-actions>
</div>
