<div class="dialogo-fase">
  <div class="dialogo-fase__topo">
    <h2 mat-dialog-title>Avançar para {{ faseLabel[proximaFase] }}</h2>
    <button mat-icon-button type="button" (click)="fechar()" aria-label="Fechar">
      <i class="ph ph-x"></i>
    </button>
  </div>

  <form [formGroup]="form" (ngSubmit)="salvar()">
    <mat-dialog-content>
      <p>
        O imóvel "{{ imovel.identificador }}" vai passar de {{ faseLabel[imovel.fase] }} para
        {{ faseLabel[proximaFase] }}.
      </p>
      <mat-form-field appearance="outline">
        <mat-label>Data da transição</mat-label>
        <input matInput type="date" formControlName="data" />
      </mat-form-field>
    </mat-dialog-content>

    <mat-dialog-actions align="end">
      <button mat-stroked-button type="submit" color="primary" [disabled]="form.invalid || salvando()">
        {{ salvando() ? 'Salvando...' : 'Confirmar' }}
      </button>
    </mat-dialog-actions>
  </form>
</div>
