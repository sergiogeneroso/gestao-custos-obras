<div class="dialogo-pessoa">
  <div class="dialogo-pessoa__topo">
    <h2 mat-dialog-title>{{ pessoa ? 'Editar pessoa' : 'Nova pessoa' }}</h2>
    <button mat-icon-button type="button" (click)="fechar()" aria-label="Fechar">
      <i class="ph ph-x"></i>
    </button>
  </div>

  <form [formGroup]="form" (ngSubmit)="salvar()">
    <mat-dialog-content>
      <div class="dialogo-pessoa__grade">
        <mat-form-field appearance="outline" class="dialogo-pessoa__campo-largo">
          <mat-label>Nome</mat-label>
          <input matInput formControlName="nome" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Tipo</mat-label>
          <mat-select formControlName="tipoPessoa">
            @for (tipo of tipos; track tipo) {
              <mat-option [value]="tipo">{{ tipoLabel[tipo] }}</mat-option>
            }
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Documento</mat-label>
          <input matInput formControlName="documento" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>E-mail</mat-label>
          <input matInput type="email" formControlName="email" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Telefone</mat-label>
          <input matInput formControlName="telefone" />
        </mat-form-field>
      </div>
    </mat-dialog-content>

    <mat-dialog-actions align="end">
      <button mat-stroked-button type="submit" color="primary" [disabled]="form.invalid || salvando()">
        {{ salvando() ? 'Salvando...' : 'Salvar' }}
      </button>
    </mat-dialog-actions>
  </form>
</div>
